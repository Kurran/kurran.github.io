<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The personal homepage of Kurran.">
  <meta name="theme-color" content="#141711">
  <title>Kurran — Home</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #141711;
      --paper: #f3f2e8;
      --muted: #b8bdae;
      --accent: #e4ff8b;
      --rule: #373e30;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font: 1rem/1.5 system-ui, sans-serif;
    }

    .shell {
      width: min(100% - clamp(2.5rem, 10vw, 10rem), 90rem);
      min-height: 100svh;
      margin-inline: auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font: 0.75rem/1.4 var(--mono);
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    header { padding-block: 1.4rem; border-bottom: 1px solid var(--rule); }
    footer { padding-block: 1.35rem; border-top: 1px solid var(--rule); color: var(--muted); }
    .identity { display: inline-flex; align-items: center; gap: 0.75rem; font-weight: 700; }
    .mark {
      display: grid;
      width: 2rem;
      height: 2rem;
      place-items: center;
      background: var(--accent);
      color: var(--ink);
      font: 700 1rem Georgia, serif;
    }
    .edition { color: var(--muted); text-align: right; }

    main {
      display: grid;
      grid-template-columns: 0.95fr 1fr;
      align-items: center;
      gap: clamp(1.5rem, 5vw, 6rem);
      padding-block: clamp(3rem, 8vh, 7rem);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin: 0 0 1.5rem;
      color: var(--accent);
      font: 0.73rem/1.4 var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 1.5rem; height: 1px; background: currentColor; }

    h1 {
      margin: 0;
      font: 400 clamp(2.25rem, 4.5vw, 5rem)/1 Georgia, serif;
      letter-spacing: -0.06em;
    }
    .name {
      display: block;
      margin: 0.08em 0 0 -0.055em;
      color: var(--accent);
      font-size: 2.06em;
      line-height: 0.93;
      letter-spacing: -0.09em;
    }
    .description { margin: 1.75rem 0 1.6rem; color: var(--muted); }
    .profile {
      display: inline-flex;
      min-height: 3rem;
      align-items: center;
      gap: 1.25rem;
      padding: 0.65rem 1rem;
      border: 1px solid #626b55;
      color: var(--paper);
      font: 0.76rem/1.3 var(--mono);
      text-decoration: none;
      transition: background-color 160ms ease, color 160ms ease;
    }
    .profile:hover { background: var(--accent); color: var(--ink); }
    .profile:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }

    [hidden] { display: none !important; }
    .entry {
      display: grid;
      min-height: 100svh;
      place-items: center;
      padding: 1.25rem;
      background: radial-gradient(ellipse at center, #2b3422, var(--ink) 65%);
    }
    .entry-card {
      width: min(100%, 26rem);
      padding: clamp(1.5rem, 6vw, 3rem);
      border: 1px solid var(--rule);
      background: var(--ink);
    }
    .entry-card h1 { font-size: clamp(2rem, 7vw, 3rem); }
    .entry-card form { margin-top: 1.75rem; }
    .entry-card label { display: block; margin-bottom: 0.5rem; color: var(--muted); }
    .entry-card input {
      width: 100%;
      min-height: 3rem;
      padding: 0.65rem 0.85rem;
      border: 1px solid #626b55;
      border-radius: 0;
      background: #1b2017;
      color: var(--paper);
      font: inherit;
    }
    .entry-card input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .entry-card input[aria-invalid="true"] { border-color: #ffb3a0; }
    .entry-card button {
      justify-content: space-between;
      width: 100%;
      margin-top: 1rem;
      background: var(--accent);
      color: var(--ink);
      cursor: pointer;
    }
    .entry-card button:hover { background: var(--paper); }
    .entry-error { margin: 0.65rem 0 0; color: #ffb3a0; }
    .entry-error:empty { margin: 0; }

    .art {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid var(--rule);
      background: radial-gradient(ellipse at 50% 50%, #2b3422 0%, #191e15 58%, #151912 100%);
    }
    .art text { font-family: var(--mono); }
    .art .monogram { font-family: Georgia, serif; font-style: italic; }

    @media (max-width: 760px) {
      main { grid-template-columns: minmax(0, 1fr); gap: 2.25rem; }
      h1 { font-size: clamp(2.25rem, 7vw, 4rem); }
      .art { max-width: 36rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .profile { transition: none; }
    }
  </style>
</head>
<body>
  <main class="entry" id="entry" aria-labelledby="entry-title">
    <div class="entry-card">
      <p class="eyebrow">Kurran</p>
      <h1 id="entry-title">Enter password</h1>
      <form id="entry-form">
        <label for="entry-password">Password</label>
        <input id="entry-password" type="password" inputmode="numeric" required aria-describedby="entry-error">
        <p class="entry-error" id="entry-error" aria-live="polite"></p>
        <button class="profile" type="submit" disabled>Enter site <span aria-hidden="true">↗</span></button>
      </form>
      <noscript><p>Enable JavaScript to enter the site.</p></noscript>
    </div>
  </main>

  <div class="shell" id="home" hidden>
    <header>
      <span class="identity"><span class="mark" aria-hidden="true">K</span> Kurran</span>
      <span class="edition">Personal site</span>
    </header>

    <main>
      <section aria-labelledby="welcome">
        <p class="eyebrow">Welcome</p>
        <h1 id="welcome" tabindex="-1">This is the home of <span class="name">Kurran</span></h1>
        <p class="description">My little corner of the internet.</p>
        <a class="profile" href="https://github.com/Kurran">Find me on GitHub <span aria-hidden="true">↗</span></a>
      </section>

      <svg class="art" viewBox="0 0 560 560" aria-hidden="true" focusable="false">
        <defs>
          <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
            <path d="M28 0H0V28" fill="none" stroke="#b7c99f" stroke-opacity=".12"/>
          </pattern>
        </defs>
        <rect width="560" height="560" fill="url(#grid)"/>
        <path d="M280 40V520M40 280H520" stroke="#aebc9b" stroke-opacity=".18" stroke-dasharray="4 8"/>
        <g fill="none" stroke="#acba92">
          <circle cx="280" cy="280" r="194" stroke-opacity=".28" stroke-dasharray="2 6"/>
          <circle cx="280" cy="280" r="146" stroke-opacity=".23"/>
          <ellipse cx="280" cy="280" rx="215" ry="87" transform="rotate(35 280 280)" stroke-opacity=".36"/>
        </g>
        <ellipse cx="280" cy="280" rx="221" ry="92" transform="rotate(-34 280 280)" fill="none" stroke="#e4ff8b" stroke-opacity=".75"/>
        <circle cx="452" cy="149" r="5" fill="#e4ff8b"/>
        <circle cx="129" cy="401" r="3" fill="#e4ff8b"/>
        <path d="M131 133v26m-13-13h26m280 245v20m-10-10h20" stroke="#e4ff8b"/>
        <text class="monogram" x="266" y="376" text-anchor="middle" font-size="290" fill="#e4ff8b">K</text>
        <path d="M24 52V24h28m456 0h28v28M24 508v28h28m456 0h28v-28" fill="none" stroke="#b8bdae" stroke-opacity=".65"/>
        <text x="38" y="57" font-size="11" letter-spacing="2" fill="#b8bdae">FIG. 01</text>
        <text x="522" y="522" text-anchor="end" font-size="11" letter-spacing="2" fill="#b8bdae">K / HOME</text>
      </svg>
    </main>

    <footer><span>© Kurran</span><span>Made for the web</span></footer>
  </div>
  <script>
    const form = document.getElementById('entry-form');
    const password = document.getElementById('entry-password');
    const error = document.getElementById('entry-error');

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      if (password.value !== '256') {
        password.setAttribute('aria-invalid', 'true');
        error.textContent = 'Incorrect password. Try again.';
        password.focus();
        password.select();
        return;
      }

      form.reset();
      document.getElementById('entry').hidden = true;
      document.getElementById('home').hidden = false;
      document.getElementById('welcome').focus();
    });

    password.addEventListener('input', () => {
      password.removeAttribute('aria-invalid');
      error.textContent = '';
    });

    form.querySelector('button').disabled = false;
  </script>
</body>
</html>
